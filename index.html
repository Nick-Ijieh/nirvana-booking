<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookings Admin | Nirvana Nook</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="login-screen" class="login-wrap">
  <form id="login-form" class="login-card">
    <h1>Nirvana Nook</h1>
    <p class="subtitle">Bookings Admin</p>
    <div class="field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required autocomplete="username">
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    <p id="login-error" class="error-msg"></p>
  </form>
</div>

<div id="dashboard" class="dashboard" style="display:none;">
  <header class="top-bar">
    <h1>Nirvana Nook &mdash; Bookings</h1>
    <button id="logout-btn" class="btn btn-outline btn-sm">Sign Out</button>
  </header>

  <div class="charts-row">
    <div class="chart-card">
      <h3>Bookings Per Day</h3>
      <canvas id="chart-per-day"></canvas>
    </div>
    <div class="chart-card">
      <h3>Bookings by Treatment</h3>
      <canvas id="chart-by-treatment"></canvas>
    </div>
  </div>

  <div class="controls">
    <div class="field inline">
      <label for="date-filter">Date</label>
      <input type="date" id="date-filter">
    </div>
    <button id="show-all-btn" class="btn btn-outline btn-sm">Show All Upcoming</button>
    <button id="show-history-btn" class="btn btn-outline btn-sm">Show Full History</button>
    <button id="show-cancelled-toggle" class="btn btn-outline btn-sm">Show Cancelled</button>
    <button id="add-booking-btn" class="btn btn-primary btn-sm" style="margin-left:auto;">+ Add Booking</button>
  </div>

  <div id="loading-msg" class="loading-msg">Loading bookings...</div>

  <div class="table-wrap">
    <table id="bookings-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>Treatment</th>
          <th>Duration</th>
          <th>Staff</th>
          <th>Client</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Status</th>
          <th>Booked On</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="bookings-body"></tbody>
    </table>
    <p id="empty-msg" class="empty-msg" style="display:none;">No bookings match this view.</p>
  </div>
</div>

<!-- Add Booking modal -->
<div id="add-modal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h2>Add a Booking</h2>
    <p class="subtitle">Use this for phone or in-person bookings.</p>

    <div id="add-step-1">
      <div class="field">
        <label for="add-service">Treatment</label>
        <select id="add-service" required>
          <option value="" disabled selected>Select a treatment</option>
          <optgroup label="Full Body Massages">
            <option data-duration="60">Swedish Massage (60 min)</option>
            <option data-duration="90">Swedish Massage (90 min)</option>
            <option data-duration="60">Aromatherapy Massage (60 min)</option>
            <option data-duration="90">Aromatherapy Massage (90 min)</option>
            <option data-duration="60">Thai Deep Tissue Oil Massage (60 min)</option>
            <option data-duration="90">Thai Deep Tissue Oil Massage (90 min)</option>
            <option data-duration="60">Lymphatic Drainage Massage (60 min)</option>
            <option data-duration="90">Lymphatic Drainage Massage (90 min)</option>
            <option data-duration="60">Couples Massage (60 min)</option>
            <option data-duration="90">Couples Massage (90 min)</option>
            <option data-duration="60">Hot Stone Therapy (60 min)</option>
            <option data-duration="90">Hot Stone Therapy (90 min)</option>
          </optgroup>
          <optgroup label="Targeted Massages">
            <option data-duration="30">Back, Neck & Shoulder Massage (30 min)</option>
            <option data-duration="45">Back, Neck & Shoulder Massage (45 min)</option>
            <option data-duration="60">Back, Neck & Shoulder Massage (60 min)</option>
            <option data-duration="30">Head Massage (30 min)</option>
            <option data-duration="45">Head Massage (45 min)</option>
            <option data-duration="30">Foot Massage (30 min)</option>
            <option data-duration="45">Foot Massage (45 min)</option>
            <option data-duration="15">Lymphatic Face Massage (15 min)</option>
            <option data-duration="15">Lymphatic Stomach Massage (15 min)</option>
            <option data-duration="20">Trap Release (20 min)</option>
          </optgroup>
          <optgroup label="Facials">
            <option data-duration="45">Deep Pore Detoxifying Facial (45 min)</option>
            <option data-duration="45">Hydra Infusion Facial (45 min)</option>
          </optgroup>
          <optgroup label="Packages">
            <option data-duration="90">Massage &amp; Facial Package (90 min)</option>
            <option data-duration="90">Lovebirds Package (90 min)</option>
          </optgroup>
        </select>
      </div>
      <div class="field">
        <label for="add-date">Date</label>
        <input type="date" id="add-date" required>
      </div>
      <p id="add-check-error" class="error-msg"></p>
      <div class="modal-actions">
        <button type="button" id="add-cancel-btn" class="btn btn-outline btn-sm">Cancel</button>
        <button type="button" id="add-check-btn" class="btn btn-primary btn-sm">Check Available Times</button>
      </div>
    </div>

    <div id="add-step-2" style="display:none;">
      <p class="field-label-standalone">Available Times</p>
      <div id="add-slots" class="admin-slot-grid"></div>
      <div class="modal-actions">
        <button type="button" id="add-back-to-1-btn" class="btn btn-outline btn-sm">&larr; Back</button>
      </div>
    </div>

    <form id="add-booking-form" style="display:none;">
      <p class="field-label-standalone" id="add-selected-summary"></p>
      <div class="field">
        <label for="add-name">Client Name</label>
        <input type="text" id="add-name" required>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="add-phone">Phone</label>
          <input type="tel" id="add-phone">
        </div>
        <div class="field">
          <label for="add-email">Email</label>
          <input type="email" id="add-email">
        </div>
      </div>
      <p id="add-error" class="error-msg"></p>
      <div class="modal-actions">
        <button type="button" id="add-back-to-2-btn" class="btn btn-outline btn-sm">&larr; Choose Different Time</button>
        <button type="submit" class="btn btn-primary btn-sm">Save Booking</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
